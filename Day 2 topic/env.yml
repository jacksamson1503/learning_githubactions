name: env demo

on:
  workflow_dispacth:

env:
  APP_NAME: netflix

jobs:
  demo:
    runs-on: ubuntu-latest
  env:
    APP_NAME: Amazon

  steps:
    - name: Print the job 
      run: echo $APP_NAME

    - name: print the second job
      env:
       APP_NAME:Flipcart
      run: echo $APP_NAME

    - name: print the three job
      run: $APP_NAME

# Environment variables and their THREE scopes
# You can define custom variables with `env:` at three levels.
# Inner scopes OVERRIDE outer scopes (step > job > workflow).
# Read them in shell as $NAME, or in expressions as ${{ env.NAME }}.
