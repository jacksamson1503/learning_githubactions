#runs - its execute what enter the command
#uses- run a prebuild action created by github actions
#fetch -controls how much git history is done during checout
#fetch0 - it will show all count
#fetch2 - it will show the last two commit count
#fetch1 - it will show the last one commit count
name: 09 - run vs uses

on:
  workflow_dispatch:

jobs:
  intro:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v5

      - name: Run a shell command
        run: echo "Files in the repo:" && ls -la

depth-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with fetch-depth 1 (shallow - default)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Show commit count
        run: echo "Commit count:" && git log --oneline | wc -l
        
  depth-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with fetch-depth 2
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Show commit count
        run: echo "Commit count:" && git log --oneline | wc -l      
  
  depth-0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with fetch-depth 1 (shallow - default)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show commit count
        run: echo "Commit count:" && git log --oneline | wc -l
