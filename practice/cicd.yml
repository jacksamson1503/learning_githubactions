name: Fresher CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test --if-present

    - name: Build Application
      run: npm run build --if-present

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/sample-app:${{ github.run_number }} .
        docker tag ${{ secrets.DOCKER_USERNAME }}/sample-app:${{ github.run_number }} \
                   ${{ secrets.DOCKER_USERNAME }}/sample-app:latest

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/sample-app:${{ github.run_number }}
        docker push ${{ secrets.DOCKER_USERNAME }}/sample-app:latest

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/sample-app:latest
          docker stop sample-app || true
          docker rm sample-app || true
          docker run -d --name sample-app -p 80:3000 \
            ${{ secrets.DOCKER_USERNAME }}/sample-app:latest


#required
#DOCKER_USERNAME
#DOCKER_PASSWORD
#EC2_HOST
#EC2_SSH_KEY