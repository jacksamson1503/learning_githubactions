name: Cache Demo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-demo

      - name: Show Cache Location
        run: |
          echo "Caching npm packages in ~/.npm"
          ls -la ~/
